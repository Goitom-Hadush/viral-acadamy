name: success_life_coaching_app
description: "Success Life Coaching Academy mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Networking & HTTP
  http: ^1.1.0
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Video & Media
  video_player: ^2.7.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0

  # Navigation
  go_router: ^10.0.0

  # Notifications & Firebase (Optional - commented out for demo)
  # firebase_messaging: ^14.6.0
  # firebase_core: ^2.24.0

  # Internationalization
  intl: ^0.20.2

  # Website fonts (Poppins body, Merriweather headings) and opening web links
  google_fonts: 9.0.0
  url_launcher: 6.3.3

  # Utils
  uuid: ^4.0.0
  # Connectivity (Optional for demo)
  # connectivity_plus: ^5.0.0
  # Permissions (Optional for demo)
  # permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  flutter_launcher_icons: 0.14.4

# App icon generated from the website logo (public/logo.png).
# Regenerate after changing the images: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    # Copied from the website's lang/*.json so the app shows the same texts.
    - assets/lang/
    - assets/images/
    - assets/icons/
    - assets/animations/
